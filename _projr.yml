directories:
  raw-img-2024:
    path: _raw/img/2024
  raw-img-2025:
    path: _raw/img/2025
  raw-docs:
    path: _reference
    ignore-git: no
  cache:
    path: _tmp
  output:
    path: _output
  docs:
    path: docs
build:
  github:
    latest-2025:
      content:
      - raw-img-2024
      - raw-img-2025
      - raw-docs
      - docs
      - output
      structure: latest
    archive-2025:
      content:
      - raw-img-2024
      - raw-img-2025
      - raw-docs
      - docs
      - output
      structure: archive

